#项目名字mockmate，中文为面试搭子
spring:
  application:
    name: mockmate

#  数据库配置
  # mysql
  datasource:
    url: jdbc:mysql://localhost:3306/mockmate
    username: root
    password: 2635534555ZSj
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 1             #不同的数据库
      password: 123456        #密码
      timeout: 3s             #命令超时
      connect-timeout: 3s     #连接超时

  # multipart接收文件大小的限制
  servlet:
    multipart:
      max-file-size: 10MB #单文件
      max-request-size: 10MB #总大小

  # 流式输出是异步请求，默认超时偏短，长回答会被掐断
  mvc:
    async:
      request-timeout: 120s

  # ai模型使用Ollama本地配置的qwen3:8b
  # 注意：这一整块必须缩进在 spring: 下面。之前它顶到 mybatis: 之后（缩进错位），
  # 整段配置不生效，Ollama 就退回了默认的 mistral 模型，调用时报 model 'mistral' not found
  ai:
    model:
      chat: ollama        # 只激活 Ollama，避免 ChatClient 注入歧义
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:8b
        think: false      # qwen3 默认先吐思维链
        num-ctx: 8192     # 上下文

# MyBatis：数据库列名 password_hash 自动映射到 Java 字段 passwordHash
mybatis:
  configuration:
    map-underscore-to-camel-case: true

# AI 人设（system prompt）：改这里就行，重启生效，不用动 Java 代码
app:
  ai:
    system-prompt: |
      你是 mockmate 的 AI 面试官。
      规则：
      1. 每次只问一个问题，问完就停，等候选人回答；
      2. 全程中文口语化，不要用 Markdown 标题和列表符号；
      3. 不要替候选人回答，也不要一次抛出多个问题。
    # 交给模型的最大消息条数（一问一答算 2 条），用来控制"AI 记得多久"。
    # 只影响喂给模型的窗口大小，不影响 interview_message 里的全量记录。
    memory:
      window: 12

    #
    resume:
      upload-dir: ./data/resume     # 原件落盘目录，相对项目根
# JWt配置
  jwt:
    secret: ${JWT_SECRET:dev-only-please-change-this-secret-32bytes}   # 至少 32 字节
    ttl: 8h   #持续时间
